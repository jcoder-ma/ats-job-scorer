# Validate the Python engine and browser script on pull requests and main.
# Stage an explicit public-file allowlist, then deploy only main to Pages.
# Pull requests run checks without publishing; deployment permissions are
# limited to the deploy job and require Pages to use GitHub Actions.
name: Test and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall web/engine.py
      - run: node --check web/app.js
      - name: Stage only public files
        run: |
          mkdir -p _site
          cp web/index.html web/style.css web/app.js web/worker.js web/engine.py _site/
          cp -r web/vendor _site/vendor
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
